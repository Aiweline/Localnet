name: Release Weline Localnet

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source ref
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-decision.sh
          validate_release_ref "$GITHUB_EVENT_NAME" "$GITHUB_REF"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run presence regression test
        run: node --test --experimental-strip-types tests/presence.test.ts

      - name: Run transfer status regression test
        run: node --test --experimental-strip-types tests/transfer-status.test.ts

      - name: Set up Ruby for release workflow validation
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run release workflow regression test
        run: node --test tests/release-workflow.test.mjs

      - name: Validate synchronized versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs --check
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether this commit needs a release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_BEFORE: ${{ github.event.before }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release-decision.sh "$RELEASE_VERSION"

  windows:
    name: Build Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: pnpm release:check

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis

      - name: Verify and collect Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.prepare.outputs.version }}"
          $setups = @(Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -File -Filter "*_${version}_x64-setup.exe")
          if ($setups.Count -ne 1) {
            throw "Expected exactly one Windows setup package for $version; found $($setups.Count)"
          }

          $portable = Get-Item -LiteralPath "src-tauri/target/release/localnet.exe"
          if ($setups[0].VersionInfo.ProductVersion -ne $version) {
            throw "Setup version mismatch: $($setups[0].VersionInfo.ProductVersion)"
          }
          if ($portable.VersionInfo.ProductVersion -ne $version) {
            throw "Portable version mismatch: $($portable.VersionInfo.ProductVersion)"
          }

          New-Item -ItemType Directory -Path "release/windows" -Force | Out-Null
          $setupOutput = "release/windows/Weline_Localnet_${version}_x64-setup.exe"
          $portableOutput = "release/windows/Weline_Localnet_${version}_x64-portable.exe"
          Copy-Item -LiteralPath $setups[0].FullName -Destination $setupOutput
          Copy-Item -LiteralPath $portable.FullName -Destination $portableOutput

          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setupOutput).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $portableOutput).Hash.ToLowerInvariant()
          $lines = @(
            "$setupHash  Weline_Localnet_${version}_x64-setup.exe",
            "$portableHash  Weline_Localnet_${version}_x64-portable.exe"
          )
          [System.IO.File]::WriteAllLines(
            "release/windows/Weline_Localnet_${version}_SHA256SUMS.txt",
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: weline-localnet-windows-${{ needs.prepare.outputs.version }}
          path: release/windows/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS universal
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: pnpm release:check

      - name: Run Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build universal DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Verify macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true' EXIT
          app_path="$(find "$mount_dir" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app_path"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw "$app_path/Contents/Info.plist")"
          local_network_description="$(plutil -extract NSLocalNetworkUsageDescription raw "$app_path/Contents/Info.plist")"
          bonjour_service="$(plutil -extract NSBonjourServices.0 raw "$app_path/Contents/Info.plist")"
          binary_path="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$binary_path"
          archs="$(lipo -archs "$binary_path")"
          echo "Verified DMG: $dmg_path"
          echo "Bundle version: $bundle_version"
          echo "Local Network description: $local_network_description"
          echo "Bonjour service: $bonjour_service"
          echo "Executable architectures: $archs"
          test "$bundle_version" = "$version"
          test -n "$local_network_description"
          test "$bonjour_service" = "_p2p._udp"
          [[ "$archs" == *arm64* ]]
          [[ "$archs" == *x86_64* ]]

      - name: Collect macOS package and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p release/macos
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          output="release/macos/Weline_Localnet_${version}_universal.dmg"
          cp "$dmg_path" "$output"
          (
            cd release/macos
            shasum -a 256 "Weline_Localnet_${version}_universal.dmg" > "Weline_Localnet_${version}_universal.dmg.sha256"
          )

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: weline-localnet-macos-${{ needs.prepare.outputs.version }}
          path: release/macos/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - windows
      - macos
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for immutable release policy checks
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: weline-localnet-windows-${{ needs.prepare.outputs.version }}
          path: release-assets

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: weline-localnet-macos-${{ needs.prepare.outputs.version }}
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          expected="$(printf '%s\n' \
            "Weline_Localnet_${version}_SHA256SUMS.txt" \
            "Weline_Localnet_${version}_universal.dmg" \
            "Weline_Localnet_${version}_universal.dmg.sha256" \
            "Weline_Localnet_${version}_x64-portable.exe" \
            "Weline_Localnet_${version}_x64-setup.exe" | sort)"
          actual="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected assets:"
            printf '%s\n' "$expected"
            echo "Actual assets:"
            printf '%s\n' "$actual"
            exit 1
          fi

          (
            cd release-assets
            sha256sum -c "Weline_Localnet_${version}_SHA256SUMS.txt"
            expected_mac="$(awk '{print $1}' "Weline_Localnet_${version}_universal.dmg.sha256")"
            actual_mac="$(sha256sum "Weline_Localnet_${version}_universal.dmg" | awk '{print $1}')"
            test "$actual_mac" = "$expected_mac"
          )

      - name: Build bilingual release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          source scripts/release-decision.sh
          write_release_notes "$version" "$GITHUB_SHA" release-notes.md

      - name: Create or repair GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="v${version}"
          repository="$GITHUB_REPOSITORY"
          source scripts/release-decision.sh

          # This metadata-scoped check is tamper-evident, not self-healing. The
          # audited no-bypass snapshot is maintained by a repository administrator.
          verify_audited_release_tag_policy "$repository"
          if git rev-parse --verify --quiet "$tag^{commit}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Refusing to publish $tag from $GITHUB_SHA because the tag points to $tag_commit."
              exit 1
            fi
            verify_remote_release_tag origin "$tag" "$GITHUB_SHA"
          else
            verify_audited_release_tag_policy "$repository"
            create_remote_release_tag origin "$tag" "$GITHUB_SHA"
          fi

          release_json="$(find_release_by_tag "$repository" "$tag")"
          if [[ -n "$release_json" ]]; then
            release_id="$(node scripts/release-policy.mjs release-id <<< "$release_json")"
            release_state="$(node scripts/release-policy.mjs release-state <<< "$release_json")"
            if [[ "$release_state" == "published" ]]; then
              if validate_published_immutable_release "$release_json" "$version" release-notes.md; then
                echo "Published immutable release $tag already matches the exact notes and five assets; no mutation is permitted."
                exit 0
              fi
              echo "::error::Published release $tag is mutable or differs from the exact immutable release contract; published releases are never repaired."
              exit 1
            fi
            if ! validate_resumable_draft_release "$release_json" "$version" release-notes.md; then
              echo "::error::Existing draft $tag is not an owned, exact release draft and will not be mutated."
              exit 1
            fi
          else
            guard_release_mutation "$repository" origin "$tag" "$GITHUB_SHA"
            gh release create "$tag" \
              --repo "$repository" \
              --target "$GITHUB_SHA" \
              --title "Weline Localnet v${version}" \
              --notes-file release-notes.md \
              --verify-tag \
              --draft
            release_json="$(find_release_by_tag "$repository" "$tag")"
            if ! validate_resumable_draft_release "$release_json" "$version" release-notes.md; then
              echo "::error::The newly created release draft could not be read back exactly."
              exit 1
            fi
            release_id="$(node scripts/release-policy.mjs release-id <<< "$release_json")"
          fi

          assets=(
            "release-assets/Weline_Localnet_${version}_SHA256SUMS.txt"
            "release-assets/Weline_Localnet_${version}_universal.dmg"
            "release-assets/Weline_Localnet_${version}_universal.dmg.sha256"
            "release-assets/Weline_Localnet_${version}_x64-portable.exe"
            "release-assets/Weline_Localnet_${version}_x64-setup.exe"
          )
          guard_release_mutation "$repository" origin "$tag" "$GITHUB_SHA"
          gh release upload "$tag" "${assets[@]}" --repo "$repository" --clobber

          release_json="$(read_release_by_id "$repository" "$release_id")"
          if ! validate_release_common "$release_json" "$version" release-notes.md; then
            echo "::error::Draft $tag does not contain exactly five uploaded assets; refusing to publish."
            exit 1
          fi

          guard_release_mutation "$repository" origin "$tag" "$GITHUB_SHA"
          gh release edit "$tag" \
            --repo "$repository" \
            --title "Weline Localnet v${version}" \
            --notes-file release-notes.md \
            --draft=false \
            --prerelease=false \
            --latest

          release_json="$(read_release_by_id "$repository" "$release_id")"
          if ! validate_published_immutable_release "$release_json" "$version" release-notes.md; then
            echo "::error::Published release $tag did not become immutable with the exact five assets. Administrator action is required; the workflow will not repair it."
            exit 1
          fi
