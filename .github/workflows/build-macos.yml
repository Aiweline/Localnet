name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-universal:
    name: macOS universal DMG
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Collect package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/macos
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          cp "$dmg_path" release/macos/Localnet_0.1.0_universal.dmg
          shasum -a 256 release/macos/Localnet_0.1.0_universal.dmg > release/macos/Localnet_0.1.0_universal.dmg.sha256

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: localnet-macos-universal
          path: release/macos/*
          if-no-files-found: error
          retention-days: 14
