name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-universal:
    name: macOS universal DMG
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package version
        id: version
        shell: bash
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build universal DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Verify bundled local-network permissions
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          plist="$app_path/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' "$plist")" = "_p2p._udp"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$plist" | grep -q 'Localnet'
          plutil -p "$plist"

      - name: Collect package and checksum
        shell: bash
        env:
          LOCALNET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p release/macos
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          output="release/macos/Localnet_${LOCALNET_VERSION}_universal.dmg"
          cp "$dmg_path" "$output"
          shasum -a 256 "$output" > "${output}.sha256"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: localnet-macos-universal-${{ steps.version.outputs.value }}
          path: release/macos/*
          if-no-files-found: error
          retention-days: 14
