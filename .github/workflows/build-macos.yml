name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-universal:
    name: macOS universal DMG
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Verify macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          test "$(plutil -extract CFBundleShortVersionString raw "$app_path/Contents/Info.plist")" = "$version"
          test -n "$(plutil -extract NSLocalNetworkUsageDescription raw "$app_path/Contents/Info.plist")"
          test "$(plutil -extract NSBonjourServices.0 raw "$app_path/Contents/Info.plist")" = "_p2p._udp"
          binary_path="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$binary_path"
          archs="$(lipo -archs "$binary_path")"
          echo "Verified bundle: $app_path"
          echo "Bundle version: $version"
          echo "Executable architectures: $archs"
          [[ "$archs" == *arm64* ]]
          [[ "$archs" == *x86_64* ]]

      - name: Collect package and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release/macos
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          output="release/macos/Weline_Chat_${version}_universal.dmg"
          cp "$dmg_path" "$output"
          shasum -a 256 "$output" > "$output.sha256"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: localnet-macos-universal
          path: release/macos/*
          if-no-files-found: error
          retention-days: 14
